<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viva+</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --verde:#1f9d6b; --fundo:#f1faf5; --texto:#1c2b24; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Arial,sans-serif; background:var(--fundo); color:var(--texto); line-height:1.5; }
  header { background:var(--verde); color:#fff; text-align:center; padding:28px 16px; }
  header h1 { margin:0; font-size:2.4rem; }
  header p { margin:6px 0 0; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  h2 { margin-top:0; }
  .sec { color:var(--verde); margin:26px 0 0; font-size:1.1rem; border-bottom:2px solid #d5eee2; padding-bottom:4px; }
  label { display:block; margin-top:12px; font-weight:600; }
  label small { display:block; font-weight:400; }
  input, select { width:100%; padding:10px; margin-top:4px; font-size:1rem; border:1px solid #b9d9c9; border-radius:8px; background:#fff; }
  .row { display:flex; gap:10px; }
  .row > label { flex:1; }
  .erro { border-color:#d64545; background:#fff1f1; }
  button { width:100%; margin-top:18px; padding:14px; font-size:1.1rem; font-weight:700; color:#fff; background:var(--verde); border:0; border-radius:10px; }
  #msg { color:#d64545; font-weight:600; margin:10px 0 0; }
  #resultado { display:none; }
  .nota { text-align:center; font-size:2.6rem; font-weight:800; color:var(--verde); margin:0; }
