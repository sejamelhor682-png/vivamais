<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viva+ | Pesquisa de saúde e bem-estar</title>
<meta name="theme-color" content="#2D2A7A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FB;--card:#fff;--ink:#16163A;--mut:#55587A;--pri:#2D2A7A;--on:#fff;--line:#D6DAEA;--ok:#0E7C66}
@media(prefers-color-scheme:dark){:root{--bg:#0F1030;--card:#1A1B45;--ink:#EEF0FF;--mut:#B3B7DE;--pri:#8E8BFF;--on:#0F1030;--line:#33356B;--ok:#4FD1B5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;line-height:1.2;margin:0 0 .5em}
h2{font-size:1.1rem}
header{padding:20px 16px 8px;max-width:760px;margin:auto}
.logo{font:800 2rem Sora,sans-serif;color:var(--pri)}.logo span{color:var(--ok)}
main{max-width:760px;margin:auto;padding:8px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:12px;background:var(--pri);color:var(--on);font:700 1.05rem Sora,sans-serif;padding:12px 18px;cursor:pointer;text-align:center;margin:0 0 12px}
.btn.sec{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.btn:disabled{opacity:.6}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-weight:700;margin-bottom:8px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{flex:1 1 auto;min-width:64px;position:relative}
.opts input{position:absolute;opacity:0;inset:0}
.opts span{display:block;min-height:46px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;text-align:center;cursor:pointer;background:var(--card)}
.opts input:checked+span{background:var(--pri);color:var(--on);border-color:var(--pri);font-weight:700}
.opts input:focus-visible+span{outline:3px solid var(--ok);outline-offset:2px}
.opts .skip span{border-style:dashed;color:var(--mut)}
select,input[type=number]{width:100%;min-height:50px;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:var(--mut);font-size:.92rem;margin:4px 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:800 1.6rem Sora,sans-serif;color:var(--pri)}
.chart{position:relative;height:240px}
.txt{color:var(--mut);font-size:.88rem;margin:8px 0 0}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;min-height:48px;background:none;border:0;color:var(--mut);font:600 .95rem Sora,sans-serif;cursor:pointer;border-radius:10px}
.nav button[aria-current=page]{color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.warn{border-left:5px solid var(--ok)}
.err{color:#C0263F;font-weight:700}
.big{font:800 4rem/1 Sora,sans-serif;color:var(--pri);margin:4px 0}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;justify-content:space-between;gap:10px;margin:10px 0 4px}
ul{padding-left:20px;margin:6px 0}
.card>p:first-child{margin-top:0}.card>p:last-child{margin-bottom:0}
</style>
</head>
<body>
<header>
  <div class="logo" role="img" aria-label="Viva mais">Viva<span>+</span></div>
  <p class="hint" style="margin:0">Pesquisa anônima sobre saúde e bem-estar dos jovens</p>
</header>
<main id="main" tabindex="-1"></main>
<nav class="nav" aria-label="Principal">
  <button data-v="home">Resultados</button>
  <button data-v="info">Sobre</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* ====== CONFIGURE AQUI ====== */
const SUPABASE_URL = "";   // ex: https://abcd.supabase.co
const SUPABASE_KEY = "";   // chave "anon public"
const TURMAS = ["1º MCN","1º LCH","1º RCH","2º LCH","2º MCN","3º MOD","3º NAR","Outra"];
/* ============================ */

const sb = (SUPABASE_URL && SUPABASE_KEY && window.supabase) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const $ = s => document.querySelector(s);
const main = $("#main");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COR = ["#4B47D6","#14A38B","#F2A900","#E04F6D","#8E6BDB","#3DA9FC","#7A7F9D"];
const FAIXAS = [["10-12",10,12],["13-14",13,14],["15-16",15,16],["17-18",17,18],["19+",19,99]];
const faixa = i => (FAIXAS.find(f => i>=f[1] && i<=f[2])||[])[0];
const DIAS = [0,1,2,3,4,5,6,7].map(n=>[n,String(n)]);
const FREQ = ["Nunca","Já experimentei","Às vezes","Com frequência"];
const HABITOS = ["Beber água","Dormir bem","Fazer exercícios","Comer frutas e verduras","Meditar ou relaxar","Conversar com amigos e família","Limitar o tempo de tela","Nenhum deles"];
const CATS = ["Abaixo do peso","Peso adequado","Sobrepeso","Obesidade"];

/* ---------- 1 resposta por aparelho ---------- */
const getCookie = n => (document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)"))||[])[1];
const setCookie = (n,v) => document.cookie = `${n}=${v}; max-age=63072000; path=/; SameSite=Lax`;
function deviceId(){
  let id = localStorage.getItem("viva_id") || getCookie("viva_id");
  if(!id){ id = crypto.randomUUID(); }
  localStorage.setItem("viva_id",id); setCookie("viva_id",id); return id;
}
const jaRespondeu = () => !!(localStorage.getItem("viva_res") || getCookie("viva_ok"));

/* ---------- dados ---------- */
async function lerTudo(){
  if(sb){ const {data,error}=await sb.from("respostas").select("*").limit(5000); if(error) throw error; return data; }
  return JSON.parse(localStorage.getItem("viva_demo")||"[]");
}
async function salvar(r){
  if(sb){ const {error}=await sb.from("respostas").insert(r); if(error) throw error; }
  else { const d=JSON.parse(localStorage.getItem("viva_demo")||"[]"); d.push(r); localStorage.setItem("viva_demo",JSON.stringify(d)); }
}

/* ---------- IMC ---------- */
/* Adultos (19+): cortes clássicos (18,5 / 25 / 30).
   10 a 18 anos: tabelas oficiais da OMS 2007 (IMC por idade, z-scores), valores aos X anos e 6 meses:
   [-2 DP = abaixo do peso, +1 DP = sobrepeso, +2 DP = obesidade]. Fonte: who.int/tools/growth-reference-data-for-5to19-years */
const WHO = {
 M:{10:[13.9,18.8,21.9],11:[14.2,19.5,23.0],12:[14.7,20.4,24.2],13:[15.2,21.3,25.3],14:[15.7,22.2,26.5],15:[16.3,23.1,27.4],16:[16.7,23.9,28.3],17:[17.1,24.6,29.0],18:[17.4,25.2,29.5]},
 F:{10:[13.7,19.4,23.1],11:[14.1,20.3,24.3],12:[14.7,21.3,25.6],13:[15.2,22.3,26.8],14:[15.7,23.1,27.8],15:[16.0,23.8,28.6],16:[16.3,24.3,29.1],17:[16.4,24.6,29.4],18:[16.5,24.9,29.6]}
};
function cortes(idade,sexo){
  if(idade>=19) return [18.5,25,30];
  if(!sexo) return null;
  return (WHO[sexo==="Masculino"?"M":"F"][idade])||null;
}
function calcIMC(peso,alt,idade,sexo){
  if(!peso||!alt) return {};
  const h=alt/100, imc=peso/(h*h), c=cortes(idade,sexo);
  const out={imc:Math.round(imc*10)/10};
  if(!c) return out;
  out.imc_cat = imc<c[0]?CATS[0]:imc<c[1]?CATS[1]:imc<c[2]?CATS[2]:CATS[3];
  out.faixaKg=[Math.ceil(c[0]*h*h), Math.floor(c[1]*h*h)];
  return out;
}

/* ---------- pontuação (estimativa educativa) ---------- */
const L=(m)=>v=>m[v];
const ITENS = [ // [campo, nome, peso, função de nota 0-100, dica]
 ["imc_cat","IMC",2,L({"Peso adequado":100,"Abaixo do peso":60,"Sobrepeso":60,"Obesidade":30}),null],
 ["sono","Sono",2,L({"8 a 9h":100,"Mais de 9h":80,"6 a 7h":65,"Menos de 6h":30}),"Adolescentes precisam de 8 a 10 horas de sono. Tente dormir e acordar em horários parecidos."],
 ["atividade","Atividade física",2,v=>v==null?undefined:Math.round(v/7*100),"A OMS recomenda 60 minutos de atividade por dia. Comece com caminhadas ou esportes com amigos."],
 ["agua","Água",1,L({"Menos de 1 L":30,"1 a 2 L":75,"Mais de 2 L":100}),"Deixe uma garrafa por perto e beba ao longo do dia."],
 ["frutas","Frutas e verduras",1,v=>v==null?undefined:Math.round(v/7*100),"Inclua uma fruta ou verdura em pelo menos uma refeição por dia."],
 ["telas","Tempo de tela",1,L({"Até 2h":100,"3 a 4h":75,"5 a 7h":45,"8h ou mais":20}),"Faça pausas das telas, principalmente antes de dormir."],
 ["humor","Humor",2,v=>v==null?undefined:Math.round((v-1)/4*100),"Conversar com alguém de confiança ajuda. Se o humor está baixo há semanas, procure apoio."],
 ["estresse","Estresse",1,v=>v==null?undefined:Math.round((5-v)/4*100),"Pausas, respiração, sono e movimento ajudam a reduzir o estresse."],
 ["saude_fisica","Saúde física percebida",1,v=>v==null?undefined:Math.round((v-1)/4*100),null],
 ["cigarro","Cigarro, vape ou narguilé",2,L({"Nunca":100,"Já experimentei":85,"Às vezes":35,"Com frequência":5}),"Fumar prejudica pulmão e coração. O SUS oferece ajuda gratuita para parar."],
 ["maconha","Maconha",2,L({"Nunca":100,"Já experimentei":85,"Às vezes":35,"Com frequência":5}),"O uso frequente na adolescência pode afetar memória, atenção e humor. Procure apoio se sentir que perdeu o controle."],
 ["alcool","Álcool",1,L({"Nunca":100,"Já experimentei":85,"Às vezes":40,"Com frequência":10}),"O álcool faz mal ao cérebro em desenvolvimento. Menores de 18 não devem beber."],
 ["habitos","Bons hábitos",1,v=>!v||!v.length?undefined:v.includes("Nenhum deles")?0:Math.min(100,Math.round(v.length/5*100)),"Escolha um hábito novo por semana, um de cada vez."]
];
function pontuar(r){
  let soma=0,pesos=0,n=0; const it=[];
  ITENS.forEach(([k,nome,p,f,dica])=>{ const s=f(r[k]); if(s==null) return; soma+=s*p; pesos+=p; n++; it.push({k,nome,s,dica}); });
  return {pct: n>=4 ? Math.round(soma/pesos) : null, it, n};
}

/* ---------- navegação ---------- */
function go(v){
  document.querySelectorAll(".nav button").forEach(b=>{ if(b.dataset.v===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  ({home,info,quiz,resultado})[v]();
  scrollTo(0,0); main.focus({preventScroll:true});
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));

/* ---------- questionário ---------- */
const Q = [
 {g:"Corpo e rotina"},
 {k:"saude_fisica",n:1,t:"Como você avalia sua saúde física?",o:[[1,"Muito ruim"],[2,"Ruim"],[3,"Regular"],[4,"Boa"],[5,"Ótima"]]},
 {k:"sono",t:"Quantas horas você dorme por noite?",o:["Menos de 6h","6 a 7h","8 a 9h","Mais de 9h"]},
 {k:"atividade",n:1,t:"Em quantos dias da semana você pratica atividade física?",o:DIAS},
 {k:"agua",t:"Quanta água você bebe por dia?",o:["Menos de 1 L","1 a 2 L","Mais de 2 L"]},
 {k:"frutas",n:1,t:"Em quantos dias da semana você come frutas ou verduras?",o:DIAS},
 {k:"telas",t:"Quantas horas por dia você passa em telas (celular, jogos, TV)?",o:["Até 2h","3 a 4h","5 a 7h","8h ou mais"]},
 {g:"Mente e emoções"},
 {k:"humor",n:1,t:"Como tem sido seu humor nas últimas semanas?",o:[[1,"Muito baixo"],[2,"Baixo"],[3,"Neutro"],[4,"Bom"],[5,"Ótimo"]]},
 {k:"estresse",n:1,t:"Quanto estresse ou ansiedade você sente?",o:[[1,"Nenhum"],[2,"Pouco"],[3,"Médio"],[4,"Alto"],[5,"Muito alto"]]},
 {g:"Substâncias (anônimo, ninguém vai saber quem você é)"},
 {k:"cigarro",t:"Você fuma cigarro, vape ou narguilé?",o:FREQ},
 {k:"maconha",t:"Você usa maconha?",o:FREQ},
 {k:"alcool",t:"Você consome bebida alcoólica?",o:FREQ},
];
const radios = (name,opts) => `<div class="opts">${opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<label><input type="radio" name="${name}" value="${esc(v)}"><span>${esc(l)}</span></label>`}).join("")}<label class="skip"><input type="radio" name="${name}" value=""><span>Não sei / prefiro pular</span></label></div>`;

function quiz(){
  if(jaRespondeu()){ return resultado(true); }
  let h=`<h1>Descubra se você está saudável</h1><p class="hint">Leva uns 3 minutos. Ninguém é identificado. Você pode pular qualquer pergunta com “Não sei”, e perguntas puladas não entram nos gráficos.${sb?"":" <b>(Modo demonstração: dados salvos só neste aparelho.)</b>"}</p><form id="f" novalidate class="card">`;
  h+=`<h2>Sobre você</h2><div class="two"><fieldset><legend><label for="turma">Turma</label></legend><select id="turma"><option value="">Escolha</option>${TURMAS.map(t=>`<option>${t}</option>`).join("")}</select></fieldset><fieldset><legend><label for="idade">Idade</label></legend><select id="idade"><option value="">Escolha</option>${Array.from({length:16},(_,i)=>`<option>${i+10}</option>`).join("")}</select></fieldset></div>`;
  h+=`<fieldset><legend>Sexo</legend>${radios("sexo",["Masculino","Feminino"])}<p class="hint">Usado só para classificar o IMC corretamente na adolescência.</p></fieldset>`;
  h+=`<div class="two"><fieldset><legend><label for="peso">Peso (kg)</label></legend><input id="peso" type="number" inputmode="decimal" step="0.1" placeholder="opcional"></fieldset><fieldset><legend><label for="alt">Altura (cm)</label></legend><input id="alt" type="number" inputmode="numeric" placeholder="opcional"></fieldset></div><p class="hint" style="margin-top:-8px">Peso e altura não são guardados. Só o IMC calculado.</p>`;
  Q.forEach(q=>{ h+= q.g ? `<h2>${q.g}</h2>` : `<fieldset><legend>${q.t}</legend>${radios(q.k,q.o)}</fieldset>`; });
  h+=`<h2>Hábitos</h2><fieldset><legend>Quais bons hábitos você pratica? (marque quantos quiser)</legend><div class="opts">${HABITOS.map(x=>`<label><input type="checkbox" name="habitos" value="${x}"><span>${x}</span></label>`).join("")}</div></fieldset>`;
  h+=`<p id="msg" class="err" role="alert"></p><button class="btn" type="submit">Ver meu resultado</button></form>`;
  main.innerHTML=h;
  $("#f").onsubmit=async e=>{
    e.preventDefault();
    const msg=$("#msg"); msg.textContent="";
    const r={device_id:deviceId(),turma:$("#turma").value,idade:+$("#idade").value};
    if(!r.turma||!r.idade){ msg.textContent="Escolha sua turma e sua idade para continuar."; return; }
    const val=n=>{const c=document.querySelector(`input[name=${n}]:checked`); return c&&c.value!==""?c.value:null;};
    r.sexo=val("sexo");
    Q.filter(q=>q.k).forEach(q=>{const v=val(q.k); r[q.k]=v==null?null:(q.n?+v:v);});
    const hb=[...document.querySelectorAll("input[name=habitos]:checked")].map(i=>i.value); r.habitos=hb.length?hb:null;
    const peso=parseFloat($("#peso").value), alt=parseFloat($("#alt").value);
    if(($("#peso").value&&!(peso>=25&&peso<=250))||($("#alt").value&&!(alt>=120&&alt<=220))){ msg.textContent="Confira o peso (25 a 250 kg) e a altura (120 a 220 cm), ou deixe os dois em branco."; return; }
    const im=calcIMC(peso,alt,r.idade,r.sexo); r.imc=im.imc??null; r.imc_cat=im.imc_cat??null;
    const sc=pontuar(r); r.pct_saudavel=sc.pct;
    const b=e.submitter; b.disabled=true; b.textContent="Enviando...";
    try{ await salvar(r); }
    catch(err){
      if(err&&err.code==="23505"){ setCookie("viva_ok","1"); msg.textContent="Este aparelho já respondeu a pesquisa. Obrigado!"; }
      else msg.textContent="Não foi possível enviar. Verifique a internet e tente de novo.";
      b.disabled=false; b.textContent="Ver meu resultado"; return;
    }
    setCookie("viva_ok","1");
    localStorage.setItem("viva_res",JSON.stringify({pct:sc.pct,it:sc.it,n:sc.n,imc:r.imc,cat:r.imc_cat,kg:im.faixaKg||null,idade:r.idade,turma:r.turma}));
    go("resultado");
  };
}

/* ---------- resultado pessoal ---------- */
async function resultado(jaFez){
  const s=JSON.parse(localStorage.getItem("viva_res")||"null");
  if(!s){ main.innerHTML=`<div class="card"><h1>Este aparelho já respondeu</h1><p>Cada aparelho responde uma vez. Obrigado por participar!</p><button class="btn" id="v">Ver resultados</button></div>`; $("#v").onclick=()=>go("home"); return; }
  const forte=[...s.it].filter(x=>!["cigarro","maconha","alcool","imc_cat"].includes(x.k)&&x.s>=85).sort((a,b)=>b.s-a.s).slice(0,3);
  const fraco=[...s.it].filter(x=>x.dica&&x.s<70).sort((a,b)=>a.s-b.s).slice(0,3);
  let h=`<h1>Seu resultado</h1>`;
  if(jaFez) h+=`<p class="hint">Este aparelho já respondeu. Aqui está o seu resultado salvo.</p>`;
  if(s.pct==null) h+=`<div class="card"><p>Você respondeu poucas perguntas, então não dá para estimar. Mesmo assim, obrigado por participar!</p></div>`;
  else{
    const faixaTxt=s.pct>=80?"Muito bom!":s.pct>=60?"Bom, com espaço para melhorar":s.pct>=40?"Atenção: vale ajustar alguns hábitos":"Vale cuidar mais de você e conversar com um profissional";
    h+=`<div class="card warn"><p style="margin:0">Estimativa de hábitos saudáveis</p><div class="big">${s.pct}%</div><div class="bar" role="img" aria-label="${s.pct} por cento"><i style="width:${s.pct}%"></i></div><p><b>${faixaTxt}</b></p><p class="hint" id="comp"></p><p class="hint">Baseada em ${s.n} respostas, comparadas com recomendações da OMS e do Ministério da Saúde. É uma estimativa educativa, não um diagnóstico.</p></div>`;
  }
  if(s.imc){
    h+=`<div class="card"><h2>Seu IMC: ${String(s.imc).replace(".",",")}${s.cat?` (${s.cat})`:""}</h2>`;
    h+= s.kg ? `<p>Para a sua altura, a faixa de peso considerada adequada fica entre <b>${s.kg[0]} e ${s.kg[1]} kg</b>.</p>` : `<p>Para classificar o IMC de quem tem menos de 19 anos, é preciso informar o sexo.</p>`;
    h+=`<p class="hint">IMC é só uma referência e não mede músculo, ossos nem saúde mental. ${s.idade<19?"Na adolescência o IMC é avaliado por idade e sexo, e o corpo ainda está em desenvolvimento. ":""}Se tiver dúvidas sobre peso ou alimentação, converse com um profissional de saúde.</p></div>`;
  }
  if(forte.length) h+=`<div class="card"><h2>Seus pontos fortes</h2><ul>${forte.map(x=>`<li>${x.nome}</li>`).join("")}</ul></div>`;
  if(fraco.length) h+=`<div class="card"><h2>Para melhorar</h2><ul>${fraco.map(x=>`<li><b>${x.nome}:</b> ${x.dica}</li>`).join("")}</ul></div>`;
  h+=`<div class="card"><p>Se estiver passando por um momento difícil, ligue para o <b>CVV: 188</b> (24 h, gratuito).</p></div><button class="btn" id="v">Ver os gráficos da pesquisa</button>`;
  main.innerHTML=h; $("#v").onclick=()=>go("home");
  if(s.pct!=null) try{ const d=(await lerTudo()).map(x=>x.pct_saudavel).filter(x=>x!=null); if(d.length>1) $("#comp").textContent=`Média dos participantes: ${Math.round(d.reduce((a,b)=>a+b,0)/d.length)}%.`; }catch(e){}
}

/* ---------- gráficos ---------- */
let charts=[], DADOS=[];
async function home(){
  main.innerHTML=`<h1>Como os jovens estão?</h1><p id="load">Carregando...</p>`;
  try{ DADOS=await lerTudo(); }catch(e){ main.innerHTML+=`<p class="err">Erro ao carregar os dados.</p>`; return; }
  main.innerHTML=`<h1>Como os jovens estão?</h1><p class="hint">Dados reais das respostas. Respostas em branco não entram nos cálculos.</p>
  <div class="card"><div class="two"><div><label for="ft">Turma</label><select id="ft"><option value="">Todas</option>${TURMAS.map(t=>`<option>${t}</option>`).join("")}</select></div><div><label for="fi">Idade</label><select id="fi"><option value="">Todas</option>${FAIXAS.map(f=>`<option>${f[0]}</option>`).join("")}</select></div></div></div>
  <div id="out"></div>
  <div class="card warn"><h2>E você?</h2><p>Responda e receba uma estimativa de quão saudável está.</p><button class="btn" id="cta">${jaRespondeu()?"Ver meu resultado":"Descobrir se estou saudável"}</button><button class="btn sec" id="csv">Baixar dados (CSV)</button></div>`;
  $("#ft").onchange=$("#fi").onchange=desenhar; $("#csv").onclick=csv; $("#cta").onclick=()=>go(jaRespondeu()?"resultado":"quiz"); desenhar();
}
const vals=(a,k)=>a.map(x=>x[k]).filter(v=>v!=null);
const media=(a,k)=>{const v=vals(a,k); return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};
const pct=(n,t)=>t?Math.round(n*100/t):0;
const fmt=(v,d=1)=>v==null?"—":v.toFixed(d).replace(".",",");
function conta(a,fn,ordem){ const m={}; a.forEach(x=>{const k=fn(x); if(k!=null) m[k]=(m[k]||0)+1;}); const ks=ordem||Object.keys(m); return {l:ks.map(String),v:ks.map(k=>m[k]||0)}; }

function desenhar(){
  charts.forEach(c=>c.destroy()); charts=[];
  const t=$("#ft").value,i=$("#fi").value;
  const a=DADOS.filter(x=>(!t||x.turma===t)&&(!i||faixa(x.idade)===i));
  const out=$("#out");
  if(!a.length){ out.innerHTML=`<div class="card"><p>Ainda não há respostas${t||i?" para este filtro":""}. Seja o primeiro com o botão abaixo.</p></div>`; return; }
  const n=a.length, usa=a.filter(x=>x.cigarro||x.maconha), usam=usa.filter(x=>["Às vezes","Com frequência"].includes(x.cigarro)||["Às vezes","Com frequência"].includes(x.maconha)).length;
  const comImc=a.filter(x=>x.imc_cat), acima=comImc.filter(x=>x.imc_cat==="Sobrepeso"||x.imc_cat==="Obesidade").length;
  const ids=["faixa","pct","imc","humor","sono","atividade","agua","telas","subs","habitos","medias"];
  out.innerHTML=`<div class="stats">
   <div class="stat"><b>${n}</b>respostas</div>
   <div class="stat"><b>${media(a,"pct_saudavel")==null?"—":Math.round(media(a,"pct_saudavel"))+"%"}</b>índice de hábitos saudáveis</div>
   <div class="stat"><b>${comImc.length?pct(acima,comImc.length)+"%":"—"}</b>com sobrepeso ou obesidade</div>
   <div class="stat"><b>${usa.length?pct(usam,usa.length)+"%":"—"}</b>usam cigarro ou maconha às vezes ou mais</div></div>`+
   ids.map(id=>`<div class="card"><h2 id="h-${id}"></h2><div class="chart"><canvas id="c-${id}" role="img" aria-labelledby="h-${id}" aria-describedby="d-${id}"></canvas></div><p class="txt" id="d-${id}"></p></div>`).join("");

  const cor=getComputedStyle(document.documentElement).getPropertyValue("--mut").trim();
  const mk=(id,titulo,tipo,labels,ds,o={})=>{
    $("#h-"+id).textContent=titulo;
    const d0=ds[0].data,tot=d0.reduce((s,x)=>s+x,0);
    $("#d-"+id).textContent="Resumo em texto: "+(ds.length===1
      ? labels.map((l,j)=>`${l}: ${o.pm?d0[j]+" ("+pct(d0[j],tot)+"%)":fmt(d0[j])}`).join("; ")
      : ds.map(d=>d.label+" – "+labels.map((l,j)=>`${l}: ${fmt(d.data[j],0)}%`).join(", ")).join(". "))+".";
    charts.push(new Chart($("#c-"+id),{type:tipo,data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:ds.length>1,labels:{color:cor}}},
      scales:{x:{stacked:!!o.stack,ticks:{color:cor}},y:{stacked:!!o.stack,beginAtZero:true,max:o.max,ticks:{color:cor,precision:0}}}}}));
  };
  const barra=(id,titulo,c)=>mk(id,titulo,"bar",c.l,[{label:"Pessoas",data:c.v,backgroundColor:COR[0]}],{pm:1});
  const turmasPresentes=TURMAS.filter(x=>a.some(r=>r.turma===x));

  barra("faixa","Respostas por faixa etária",conta(a,x=>faixa(x.idade),FAIXAS.map(f=>f[0])));
  mk("pct","Índice médio de hábitos saudáveis por turma (0 a 100)","bar",turmasPresentes,[{label:"Índice",data:turmasPresentes.map(x=>media(a.filter(r=>r.turma===x),"pct_saudavel")||0),backgroundColor:COR[1]}],{max:100});
  mk("imc","IMC por turma (% de cada classificação)","bar",turmasPresentes,CATS.map((c,j)=>({label:c,backgroundColor:[COR[5],COR[1],COR[2],COR[3]][j],
     data:turmasPresentes.map(x=>{const g=a.filter(r=>r.turma===x&&r.imc_cat);return pct(g.filter(r=>r.imc_cat===c).length,g.length);})})),{stack:1,max:100});
  barra("humor","Humor (1 = muito baixo, 5 = ótimo)",conta(a,x=>x.humor,[1,2,3,4,5]));
  barra("sono","Horas de sono por noite",conta(a,x=>x.sono,["Menos de 6h","6 a 7h","8 a 9h","Mais de 9h"]));
  barra("atividade","Dias de atividade física por semana",conta(a,x=>x.atividade,[0,1,2,3,4,5,6,7]));
  barra("agua","Consumo de água por dia",conta(a,x=>x.agua,["Menos de 1 L","1 a 2 L","Mais de 2 L"]));
  barra("telas","Tempo de tela por dia",conta(a,x=>x.telas,["Até 2h","3 a 4h","5 a 7h","8h ou mais"]));
  mk("subs","Cigarro, maconha e álcool (% de quem respondeu)","bar",FREQ,[["cigarro","Cigarro/vape"],["maconha","Maconha"],["alcool","Álcool"]].map(([k,nm],j)=>{
     const c=conta(a,x=>x[k],FREQ),tot=c.v.reduce((s,x)=>s+x,0); return {label:nm,backgroundColor:[COR[0],COR[2],COR[3]][j],data:c.v.map(v=>pct(v,tot))};}),{max:100});
  const hc={}; a.forEach(x=>(x.habitos||[]).forEach(h=>hc[h]=(hc[h]||0)+1)); const hk=HABITOS.filter(h=>hc[h]);
  barra("habitos","Bons hábitos mais praticados",{l:hk,v:hk.map(h=>hc[h])});
  mk("medias","Médias de saúde física, humor e estresse (1 a 5)","bar",["Saúde física","Humor","Estresse"],[{label:"Média",data:["saude_fisica","humor","estresse"].map(k=>media(a,k)||0),backgroundColor:[COR[1],COR[0],COR[3]]}],{max:5});
}

function csv(){
  const cols=["turma","idade","sexo","imc","imc_cat","saude_fisica","humor","estresse","sono","atividade","agua","frutas","telas","cigarro","maconha","alcool","habitos","pct_saudavel"];
  const l=[cols.join(",")].concat(DADOS.map(r=>cols.map(c=>`"${String(r[c]==null?"":Array.isArray(r[c])?r[c].join("; "):r[c]).replace(/"/g,'""')}"`).join(",")));
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([l.join("\n")],{type:"text/csv"})); a.download="viva-mais-dados.csv"; a.click();
}

/* ---------- sobre ---------- */
function info(){
  main.innerHTML=`<h1>Sobre o Viva+</h1>
  <div class="card"><h2>Para que serve</h2><p>O Viva+ é uma pesquisa sobre bem-estar e qualidade de vida de jovens. As respostas viram gráficos de saúde física, saúde mental e hábitos, e cada pessoa recebe uma estimativa de hábitos saudáveis.</p></div>
  <div class="card"><h2>Privacidade</h2><p>A pesquisa é anônima. Não coletamos nome, e-mail, telefone, peso nem altura. Guardamos turma, idade, sexo, IMC calculado e as respostas, sempre mostradas somadas. Um código aleatório fica no aparelho só para evitar respostas repetidas.</p></div>
  <div class="card warn"><h2>Precisa conversar?</h2><p>Este site é educativo e não substitui médico, psicólogo ou nutricionista. Se você está passando por um momento difícil, ligue para o <b>CVV: 188</b> (24 horas, gratuito) ou procure um adulto de confiança.</p></div>
  <div class="card"><h2>Metodologia e fontes</h2><p>As perguntas se inspiram na PeNSE (IBGE) e no Vigitel (Ministério da Saúde). O IMC de adultos usa os cortes da OMS; de 10 a 18 anos usa as tabelas oficiais de IMC por idade e sexo da OMS (2007). A estimativa de hábitos compara cada resposta com recomendações como 60 minutos diários de atividade e 8 a 10 horas de sono para adolescentes, e dá mais peso a atividade, sono, humor e substâncias. Perguntas em branco ficam de fora. Os dados representam só quem respondeu e não toda a população.</p></div>`;
}

go("home");
</script>
